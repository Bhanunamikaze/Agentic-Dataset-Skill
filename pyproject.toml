[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dataset-generator"
version = "3.0.1"
description = "Deterministic dataset generation, verification, dedup, and export scripts for SFT and DPO workflows in agent IDEs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["dataset", "llm", "fine-tuning", "sft", "dpo", "claude-code", "codex", "antigravity"]
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/Bhanunamikaze/ai-dataset-generator"
Repository = "https://github.com/Bhanunamikaze/ai-dataset-generator"
Issues = "https://github.com/Bhanunamikaze/ai-dataset-generator/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
visual = [
  "playwright>=1.44",
]
all = [
  "pytest>=8.0",
  "ruff>=0.5",
  "playwright>=1.44",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 120
target-version = "py310"
